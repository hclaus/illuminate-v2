[project]
name = "illuminate-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-multipart>=0.0.6,<1.0.0",
    "guv-calcs>=0.8.0",
    "matplotlib>=3.8.4,<4.0.0",
    "numpy>=1.26.4,<3.0.0",
    "pandas>=2.2.2,<4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[tool.uv]
package = false

[tool.uv.sources]
guv-calcs = { git = "https://github.com/hclaus/guv-calcHC.git", branch = "main" }
